apiVersion: v1
kind: Namespace
metadata:
  name: gitops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: gitops
  labels:
    app: git-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-server
  template:
    metadata:
      labels:
        app: git-server
    spec:
      initContainers:
        - name: init-git-repo
          image: git-server:v1
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ ! -d /git/repo.git/objects ]; then
                mkdir -p /git/repo.git
                cd /git/repo.git
                git init --bare --shared=all
                git config receive.denyCurrentBranch ignore
              fi
          volumeMounts:
            - name: git-storage
              mountPath: /git
      containers:
        - name: git-server
          image: git-server:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9418
              name: git
          volumeMounts:
            - name: git-storage
              mountPath: /git
      volumes:
        - name: git-storage
          hostPath:
            path: /tmp/git-storage
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: gitops
  labels:
    app: git-server
spec:
  type: NodePort
  ports:
    - port: 9418
      targetPort: 9418
      nodePort: 30080
      name: git
  selector:
    app: git-server
