apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediator
  namespace: default
  labels:
    app: remediator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediator
  template:
    metadata:
      labels:
        app: remediator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: remediator
          image: remediator:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ARGOCD_SERVER
              value: "http://argocd-server.argocd.svc.cluster.local"
            - name: ARGOCD_USERNAME
              value: "admin"
            - name: ARGOCD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: remediator-argocd-secret
                  key: password
                  optional: true
            - name: APP_HEALTH_URL
              value: "http://gitops-microservice.production.svc.cluster.local"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
