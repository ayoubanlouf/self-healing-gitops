name: CI & Ephemeral PR Preview Lifecycle

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    if: github.event.action != 'closed'
    name: Lint, Unit Test & Helm Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8

      - name: Run Python Linting
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Unit & Telemetry Tests
        run: |
          pytest -v app/tests/
        env:
          PYTHONPATH: app

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm Chart Linting
        run: |
          helm lint charts/app

  security-scan:
    if: github.event.action != 'closed'
    name: Security & Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build local container image for scanning
        run: |
          docker build -t app:scan-test app/

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app:scan-test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-ephemeral-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    name: Provision Ephemeral PR Environment
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Ephemeral Namespace Name
        id: vars
        run: |
          echo "PREVIEW_NS=pr-${{ github.event.number }}" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Dry-Run Dynamic Helm Deployment for PR
        run: |
          echo "Deploying preview environment to namespace ${{ env.PREVIEW_NS }}"
          helm template charts/app \
            --namespace "${{ env.PREVIEW_NS }}" \
            --set image.tag="${{ env.SHORT_SHA }}" \
            --set env.ENVIRONMENT="preview-pr-${{ github.event.number }}" \
            --set replicaCount=1

      - name: Comment PR with Ephemeral Environment URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const ns = `pr-${prNumber}`;
            const previewUrl = `http://${ns}.preview.platform.local`;
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🚀 Ephemeral Preview Environment Deployed!\n\n` +
                    `- **Namespace**: \`${ns}\`\n` +
                    `- **Commit**: \`${{ env.SHORT_SHA }}\`\n` +
                    `- **Preview URL**: [${previewUrl}](${previewUrl})\n` +
                    `- **ArgoCD Application**: \`${ns}-microservice\`\n\n` +
                    `*This environment will be automatically destroyed when this PR is closed.*`
            });

  teardown-ephemeral-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    name: Destroy Ephemeral PR Environment
    runs-on: ubuntu-latest
    steps:
      - name: Teardown PR Preview Namespace
        run: |
          PREVIEW_NS="pr-${{ github.event.number }}"
          echo "Pull Request #${{ github.event.number }} was closed."
          echo "Tearing down ephemeral namespace: ${PREVIEW_NS}..."
          # If kubectl is configured:
          # kubectl delete namespace ${PREVIEW_NS} --ignore-not-found=true
          echo "Ephemeral environment ${PREVIEW_NS} successfully dismantled."
