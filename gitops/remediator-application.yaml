apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: closed-loop-remediator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git://git-server.gitops.svc.cluster.local/repo.git
    targetRevision: main
    path: remediator/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
